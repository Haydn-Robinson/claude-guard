# Default claude-guard profiles. Override or add your own in ~/.config/claude-guard/profiles.toml
# (a profile there with the same name replaces the default).
#
# Fields (all optional):
#   description, warning, extends
#   edit_paths     templates, must start with {folder}; become Edit(//<folder>/...) allow rules
#   edit_ask       same, but ask rules (prompt every time, even in auto mode)
#   edit_deny      global Edit(...) deny patterns, e.g. "~/.bashrc" (no folder needed)
#   edit_hook      "ask" | "deny": register the PreToolUse hook (`guard hook edit`) that asks/denies
#                  Edit/Write calls outside the project and every guard-granted folder
#   sandbox_write  add the folder to sandbox.filesystem.allowWrite
#   sandbox_deny_write  add the folder to sandbox.filesystem.denyWrite: Bash cannot write, rename
#                  or delete there (deny beats any allow; the Edit and Write tools are unaffected)
#   bash_allow / bash_ask / bash_deny   full Bash(...) rule strings (GLOBAL, not path-scoped:
#                  they are only safe because the sandbox bounds where writes can land)
#   read_deny      patterns turned into Read(...) deny rules (global)
#   protect        globs relative to the folder, turned into Edit(...) deny rules
#   settings       scalar settings: [{path = "a.b.c", value = ...}]

[edit]
description = "Edit tool + sandbox write access to the folder, plus basic file commands"
edit_paths = ["{folder}/**"]
sandbox_write = true
bash_allow = ["Bash(mkdir *)", "Bash(touch *)", "Bash(cp *)", "Bash(mv *)"]

# Facts behind these profiles are recorded in docs/verified-behaviour.md (ids VB-xx).

# VB-S8, VB-S9: denyWrite beats any allow, so there is no git exception.
[bash-readonly]
description = "Bash cannot write, rename or delete anything in the folder (Edit/Write tools unaffected)"
warning = "Bash is read-only in this folder, so git commands that write (add, commit, ...) fail there when run through Bash."
sandbox_deny_write = true

# VB-E4: an Edit ask rule prompts even in auto mode.
[edit-ask]
extends = ["bash-readonly"]
description = "Edit/Write tools ask before every change; Bash is read-only, so nothing can be deleted through it"
warning = "Bash is read-only in this folder (git add/commit fail there). The Edit and Write tools ask each time, including in auto mode."
edit_ask = ["{folder}/**"]

# VB-E1, VB-H1 to H3: the hook is the only way to ask/deny Edit/Write outside the granted folders.
[confine-edits]
description = "Hook: Edit/Write outside the project and your granted folders asks (works in auto mode)"
warning = "Applies to the Edit/Write tools only. If the guard command disappears, every Edit/Write is blocked (fail-closed): run `guard doctor`."
edit_hook = "ask"

[confine-edits-strict]
description = "Hook: Edit/Write outside the project and your granted folders is denied"
warning = "Applies to the Edit/Write tools only. If the guard command disappears, every Edit/Write is blocked (fail-closed): run `guard doctor`."
edit_hook = "deny"

[confirm-destructive]
description = "Ask before any file deletion command (rm, rmdir, unlink, shred)"
bash_ask = ["Bash(rm *)", "Bash(rmdir *)", "Bash(unlink *)", "Bash(shred *)"]

# VB-U4: the Edit(~/...) deny patterns follow the docs but were never observed blocking.
[floor]
description = "Baseline deny rules: catastrophic commands and edits to shell startup files, credentials and system folders"
bash_deny = [
  "Bash(sudo *)", "Bash(mkfs *)", "Bash(dd * of=/dev/*)",
  "Bash(rm -rf /)", "Bash(rm -rf /*)", "Bash(rm -rf ~)", "Bash(rm -rf ~/*)",
]
edit_deny = [
  "~/.bashrc", "~/.bash_profile", "~/.profile", "~/.zshrc", "~/.zprofile", "~/.zshenv",
  "~/.ssh/**", "~/.aws/**", "~/.gnupg/**",
  "//etc/**", "//mnt/c/Windows/**", "//mnt/c/Program Files/**",
  "//mnt/c/Program Files (x86)/**", "//mnt/c/ProgramData/**",
]

[git-safe]
description = "Common non-destructive git commands"
bash_allow = [
  "Bash(git status *)", "Bash(git diff *)", "Bash(git log *)", "Bash(git add *)",
  "Bash(git commit *)", "Bash(git restore *)", "Bash(git revert *)", "Bash(git show *)",
]

# VB-R1: "Bash(cmd *)" also matches the bare command, so only the star form is needed. VB-U6: ask
# rules assumed to behave the same.
[git-destructive]
description = "Never auto-approve destructive git commands: ask every time"
bash_ask = [
  "Bash(git reset --hard *)", "Bash(git clean *)", "Bash(git checkout . *)",
  "Bash(git push --force *)", "Bash(git branch -D *)",
]

[python]
description = "Python tooling"
bash_allow = ["Bash(uv run *)", "Bash(uv sync *)", "Bash(pytest *)", "Bash(ruff *)"]

# VB-U4: Read deny patterns follow the docs but were never observed blocking.
[secrets]
description = "Deny reading ssh keys, cloud credentials and .env files"
read_deny = ["~/.ssh/**", "~/.aws/**", "//**/.env"]

# VB-U5: sandbox.enabled is verified; the other two settings follow the docs.
[lock]
description = "Disable bypass-permissions mode, require the sandbox, forbid unsandboxed commands"
settings = [
  { path = "permissions.disableBypassPermissionsMode", value = "disable" },
  { path = "sandbox.enabled", value = true },
  { path = "sandbox.allowUnsandboxedCommands", value = false },
]
