[project]
name = "claude-guard"
version = "0.1.0"
description = "Grant, inspect and revoke Claude Code write access to folders via named profiles."
readme = "README.md"
authors = [
    { name = "Haydn Robinson", email = "haydn.robinson96@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
guard = "claude_guard:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
